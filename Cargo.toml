[package]
name = "ais_watchdog"
version = "1.0.2"
edition = "2024"

[dependencies]
#artisan_middleware = {path = "/opt/artisan/lib/artisan_lib"}
artisan_middleware = "5.6.3"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "signal", "sync", "process", "time", "net"] }
chrono = { version = "0.4.45", features = ["clock"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
prost = "0.14.4"
tokio-stream = "0.1"
bytemuck = { version = "1.25.1", features = ["derive"] }
once_cell = "1.21.4"
get_if_addrs = "0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
nix = { version = "0.29", features = ["process", "signal", "ioctl", "fs"] }
dir_watcher = "1.2.0"
toml = "1.1.3+spec-1.1.0"
hkdf = "0.13.0"
sha2 = "0.11.0"
hmac = "0.13.0"
byteorder = "1.5"
getrandom = "0.4.3"
rand = { version = "0.10.2", features = ["std"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
rayon = "1.12.0"

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.14.0", default-features = false }
tss-esapi = "7.7.0"

[build-dependencies]
tonic-prost-build = "0.14.6"
